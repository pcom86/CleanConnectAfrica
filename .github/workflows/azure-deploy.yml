name: Azure Deploy

on:
  push:
    branches: [main, Development]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'cleanconnect'
        type: string

env:
  AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore

      - name: Build AppHost
        run: dotnet build src/CleanConnect.AppHost/CleanConnect.AppHost.csproj

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Publish API container
        run: |
          dotnet publish src/CleanConnect.Api/CleanConnect.Api.csproj \
            -c Release \
            -p:ContainerRegistry=${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io \
            -p:ContainerRepository=cleanconnect-api \
            -p:ContainerImageTag=${{ github.sha }}

      - name: Publish Worker container
        run: |
          dotnet publish src/CleanConnect.Worker/CleanConnect.Worker.csproj \
            -c Release \
            -p:ContainerRegistry=${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io \
            -p:ContainerRepository=cleanconnect-worker \
            -p:ContainerImageTag=${{ github.sha }}

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: |
            {
              "environmentName": "${{ inputs.environment || 'cleanconnect' }}",
              "postgresAdminPassword": "${{ secrets.POSTGRES_ADMIN_PASSWORD }}",
              "apiImageTag": "${{ github.sha }}",
              "workerImageTag": "${{ github.sha }}",
              "frontendBaseUrl": "${{ secrets.FRONTEND_BASE_URL }}",
              "apiBaseUrl": "${{ secrets.API_BASE_URL }}",
              "ozowSiteCode": "${{ secrets.OZOW_SITE_CODE }}",
              "ozowApiKey": "${{ secrets.OZOW_API_KEY }}",
              "ozowPrivateKey": "${{ secrets.OZOW_PRIVATE_KEY }}",
              "ozowIsTest": ${{ secrets.OZOW_IS_TEST || 'false' }}
            }
          failOnStdErr: false

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./frontend
          output_location: out
